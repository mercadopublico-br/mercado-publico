
name: Testar build do Mercado Público V2

on:
  push:
    branches:
      - myNewBranch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verificar compilação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar projeto
        run: npm run build
