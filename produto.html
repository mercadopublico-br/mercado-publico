<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Produto | Mercado Público</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f3ff;font-family:Arial,sans-serif}header{padding:18px 5%;background:#15151d;border-bottom:1px solid #30303b}.logo{font-size:23px;font-weight:bold;text-decoration:none}.logo span{color:#a78bfa}main{width:min(1000px,92%);margin:30px auto}.voltar{display:inline-block;margin-bottom:20px;color:#c4b5fd}.produto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:24px;background:#15151d;border:1px solid #30303b;border-radius:18px}.imagem{min-height:300px;display:grid;place-items:center;background:#211a31;border-radius:12px;overflow:hidden;font-size:70px}.imagem img{width:100%;height:100%;max-height:520px;object-fit:contain}.detalhes h1{font-size:clamp(26px,4vw,38px);margin:12px 0}.muted{color:#a1a1aa;line-height:1.6}.preco{font-size:30px;font-weight:bold;color:#c4b5fd;margin:18px 0}.botao{display:inline-block;padding:13px 17px;background:#8b5cf6;border:0;border-radius:9px;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.secundario{background:#292936;margin-left:8px}#mensagem{color:#c4b5fd;line-height:1.5}.estado{padding:20px;border:1px dashed #494052;border-radius:12px;color:#ddd}@media(max-width:650px){.produto{grid-template-columns:1fr}.imagem{min-height:220px}.secundario{margin:10px 0 0}}
</style></head><body><header><a class="logo" href="index.html">Meu <span>Marketplace</span></a></header><main><a class="voltar" href="index.html">← Voltar aos anúncios</a><section id="conteudo" class="estado">Carregando produto...</section><p id="mensagem" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="JS/supabase.js"></script><script>
(async function(){const area=document.querySelector('#conteudo'),msg=document.querySelector('#mensagem');const id=new URLSearchParams(location.search).get('id');if(!id){area.textContent='Nenhum produto foi selecionado. Volte à página inicial e escolha um anúncio.';return}if(!window.supabaseClient){area.textContent='Não foi possível conectar ao banco.';return}const {data:p,error}=await window.supabaseClient.from('produtos').select('id,nome,descricao,preco,categoria,condicao,cidade,imagem_url,criado_em,vendedor_id').eq('id',id).maybeSingle();if(error||!p){area.textContent='Produto não encontrado ou indisponível.';return}area.className='produto';const foto=document.createElement('div');foto.className='imagem';if(p.imagem_url&&/^https?:\/\//i.test(p.imagem_url)){const img=document.createElement('img');img.src=p.imagem_url;img.alt='Foto de '+p.nome;img.addEventListener('error',()=>foto.replaceChildren(document.createTextNode('📦')));foto.append(img)}else foto.textContent='📦';const d=document.createElement('div');d.className='detalhes';const meta=document.createElement('p');meta.className='muted';meta.textContent=[p.categoria,p.condicao,p.cidade].filter(Boolean).join(' · ');const h=document.createElement('h1');h.textContent=p.nome;const preco=document.createElement('div');preco.className='preco';preco.textContent=moedaBR(p.preco);const desc=document.createElement('p');desc.className='muted';desc.style.whiteSpace='pre-wrap';desc.textContent=p.descricao||'O vendedor não adicionou uma descrição.';const aviso=document.createElement('p');aviso.className='muted';aviso.textContent='Combine os detalhes com o vendedor antes de realizar qualquer pagamento. Este site ainda não processa compras nem pagamentos.';const interesse=document.createElement('button');interesse.className='botao';interesse.textContent='Tenho interesse';interesse.onclick=async()=>{const {data}=await window.supabaseClient.auth.getUser();if(!data.user){msg.textContent='Para continuar, entre na sua conta ou crie uma conta. O sistema de mensagens ainda não está integrado.';return}msg.textContent='Você está conectado. O contato interno com o vendedor ainda não está disponível; não envie dinheiro por este site.'};const voltar=document.createElement('a');voltar.className='botao secundario';voltar.href='index.html';voltar.textContent='Ver outros produtos';d.append(meta,h,preco,desc,aviso,interesse,voltar);area.replaceChildren(foto,d)})();
</script></body></html>
